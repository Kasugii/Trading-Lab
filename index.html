<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Résonance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050409; --ink:#e9e5ff; --muted:#8d86b6;
  --violet:#8b5cf6; --deep:#4c1fb8; --cyan:#5ce1ff; --gold:#ffd27a; --red:#ff4d6d;
  --fd:"Barlow Condensed","Arial Narrow",sans-serif;
  --fm:"Share Tech Mono",monospace;
  --fb:"Inter",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);overflow:hidden;
  display:grid;place-items:center;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 55% at 50% 48%,rgba(76,31,184,.42),transparent 68%),
             radial-gradient(ellipse 40% 40% at 78% 20%,rgba(92,225,255,.12),transparent 70%);
  animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.6;transform:scale(1.08)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(139,92,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.06) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,#000 10%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,#000 10%,transparent 85%)}

.stage{position:relative;z-index:3;width:min(430px,92vw);text-align:center;
  transition:opacity .5s, transform .5s, filter .5s}

/* ---------- emblème ---------- */
.emblem{width:230px;height:230px;margin:0 auto 6px;position:relative}
.emblem svg{width:100%;height:100%;overflow:visible}
.ring-out{transform-origin:50% 50%;animation:spin 46s linear infinite}
.ring-in{transform-origin:50% 50%;animation:spin 28s linear infinite reverse}
.ticks{transform-origin:50% 50%;animation:spin 95s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blade{transform-box:fill-box;transform-origin:50% 100%;opacity:0;
  animation:unfold 1.05s cubic-bezier(.16,.84,.3,1) forwards}
@keyframes unfold{from{opacity:0;transform:translateY(9px) scaleY(.8)}to{opacity:1;transform:none}}
.blade.g2{animation-delay:.16s}.blade.g3{animation-delay:.3s}.blade.g4{animation-delay:.42s}
.hair{stroke-dasharray:var(--len,340);stroke-dashoffset:var(--len,340);
  animation:draw 1.7s cubic-bezier(.45,0,.2,1) .12s forwards}
.hair.g2{animation-delay:.3s}
@keyframes draw{to{stroke-dashoffset:0}}
.core,.core2{transform-box:fill-box;transform-origin:50% 50%;opacity:0;
  animation:corein .55s cubic-bezier(.2,1.5,.4,1) .52s forwards, corepulse 3.6s ease-in-out 1.1s infinite}
.core2{animation-delay:.62s,1.25s}
@keyframes corein{from{opacity:0;transform:scale(.15) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes corepulse{50%{opacity:.5;transform:scale(.86)}}
.arc-load{stroke-dasharray:1 999;opacity:0;transform-origin:50% 50%;transform:rotate(-90deg)}

/* ondes de choc */
.shock{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.shock i{position:absolute;width:150px;height:150px;border-radius:50%;opacity:0;
  border:2px solid var(--cyan);box-shadow:0 0 26px var(--cyan),inset 0 0 26px rgba(92,225,255,.4)}
.go .shock i{animation:wave 1.15s cubic-bezier(.2,.7,.3,1) forwards}
.go .shock i:nth-child(2){animation-delay:.14s;border-color:var(--violet);box-shadow:0 0 26px var(--violet)}
.go .shock i:nth-child(3){animation-delay:.3s;border-color:#fff;box-shadow:0 0 34px #fff}
@keyframes wave{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(4.6)}}

/* ---------- textes ---------- */
h1{font-family:var(--fd);font-style:italic;font-weight:700;font-size:40px;letter-spacing:1.5px;line-height:1;margin-bottom:6px}
.sub{font-family:var(--fm);font-size:10.5px;letter-spacing:3.4px;color:var(--muted);margin-bottom:26px}
.status{font-family:var(--fm);font-size:11px;letter-spacing:2.2px;height:16px;margin-top:16px;color:var(--muted);transition:color .2s}
.status.err{color:var(--red)}
.status.ok{color:var(--cyan)}

/* ---------- champs ---------- */
.field{position:relative;margin-bottom:12px}
.field input{width:100%;height:46px;background:rgba(255,255,255,.03);color:var(--ink);
  border:1px solid rgba(139,92,246,.26);border-radius:2px;padding:0 14px 0 42px;
  font-family:var(--fm);font-size:13.5px;letter-spacing:1px;outline:none;transition:.2s;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.field input::placeholder{color:#5c5580;letter-spacing:1.4px}
.field input:focus{border-color:var(--violet);background:rgba(139,92,246,.1);
  box-shadow:0 0 0 1px rgba(139,92,246,.35),0 0 30px -8px var(--violet)}
.field .ic{position:absolute;left:15px;top:13px;font-family:var(--fm);font-size:14px;color:#6d64a0;transition:.2s}
.field input:focus + .ic{color:var(--cyan)}
.enter{width:100%;height:48px;margin-top:6px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(100deg,var(--deep),#7c3aed 55%,#2d1080);color:#fff;border:0;
  font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:3.6px;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  transition:.2s;box-shadow:0 10px 34px -14px var(--violet)}
.enter:hover{filter:brightness(1.18);letter-spacing:4.6px}
.enter:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.5)}
.enter span{position:relative;z-index:2}
.enter::after{content:"";position:absolute;inset:0;transform:translateX(-120%);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent)}
.enter:hover::after{animation:sweep .85s ease}
@keyframes sweep{to{transform:translateX(120%)}}
.hint{font-family:var(--fm);font-size:9.5px;letter-spacing:1.4px;color:#4f4975;margin-top:20px;line-height:1.9}

/* ---------- états ---------- */
.busy .form{opacity:.25;pointer-events:none;filter:blur(1px)}
.busy .ring-out{animation-duration:3s}
.busy .ring-in{animation-duration:1.6s}
.busy .arc-load{opacity:1;animation:fill 2.9s cubic-bezier(.35,0,.4,1) forwards}
@keyframes fill{to{stroke-dasharray:553 999}}
.err-shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.bad .glyph *{stroke:var(--red)!important;filter:drop-shadow(0 0 8px var(--red))}
.bad .core{fill:var(--red)!important}
.go .stage{transform:scale(1.14);filter:brightness(1.9)}
.go .form{opacity:0}

/* ================= REMONTÉE — transition aquatique ================= */
#dive{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;opacity:0}
#dive .water{position:absolute;inset:-10%;
  background:radial-gradient(ellipse 120% 80% at 50% -20%,#12466e 0%,#0a2542 32%,#040d1c 68%,#02060f 100%)}
#dive .rays{position:absolute;inset:-20% -30%;mix-blend-mode:screen;opacity:0}
#dive .rays i{position:absolute;top:-30%;height:170%;width:9vw;transform-origin:50% 0;
  background:linear-gradient(to bottom,rgba(150,225,255,.5),rgba(150,225,255,.05) 55%,transparent 85%);
  filter:blur(14px);animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(var(--r2,4deg)) scaleX(1.25)}}
#dive .bubs i{position:absolute;bottom:-8%;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(180,235,255,.25) 55%,rgba(255,255,255,.06) 70%);
  box-shadow:inset 0 0 4px rgba(255,255,255,.6)}
@keyframes rise{
  0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  12%{opacity:.85}
  80%{opacity:.7}
  100%{opacity:0;transform:translate3d(var(--dx),-118vh,0) scale(1.15)}}
#dive .surf{position:absolute;left:-6%;right:-6%;height:170vh;top:-175vh}
#dive .surf .edge{position:absolute;top:0;left:0;width:100%;height:110px;
  filter:drop-shadow(0 -6px 26px rgba(160,235,255,.85))}
#dive .surf .fill{position:absolute;top:104px;left:0;right:0;bottom:0;
  background:linear-gradient(to bottom,rgba(120,215,255,.42),rgba(18,70,110,.55) 16%,rgba(4,13,28,.9) 60%,#02060f)}
#dive .bloom{position:absolute;inset:0;opacity:0;
  background:radial-gradient(ellipse 90% 62% at 50% 46%,rgba(214,245,255,.95),rgba(120,205,255,.5) 38%,transparent 72%)}
#dive .drops i{position:absolute;top:-14%;width:2px;border-radius:2px;opacity:0;
  background:linear-gradient(to bottom,transparent,rgba(200,240,255,.85));}
@keyframes fall{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(125vh)}}

/* la plongée démarre à la validation — l'eau monte par le bas, sans coupure */
#dive .water{transform:translateY(103%)}
#dive .water::before{content:"";position:absolute;top:-72px;left:-12%;right:-12%;height:150px;
  background:radial-gradient(ellipse 58% 100% at 50% 100%,rgba(150,225,255,.5),rgba(110,180,255,.14) 52%,transparent 76%);
  filter:blur(22px)}
.go #dive{opacity:1}
.go #dive .water{animation:swell 2.1s cubic-bezier(.3,.55,.25,1) .1s forwards}
@keyframes swell{0%{transform:translateY(103%)}100%{transform:translateY(0)}}
.go #dive .rays{animation:raysin 1.85s cubic-bezier(.4,0,.4,1) .5s forwards}
@keyframes raysin{from{opacity:0;transform:scaleY(.6)}to{opacity:.55;transform:none}}
.go #dive .bubs i{animation:rise var(--dur) ease-in calc(var(--dl) + .55s) infinite}
.go .stage{animation:sink 2.1s cubic-bezier(.42,0,.34,1) .12s forwards}
@keyframes sink{
  0%{transform:none;filter:none}
  22%{transform:translateY(-1.5vh) scale(1.035);filter:brightness(1.35)}
  100%{transform:translateY(42vh) scale(.8);filter:brightness(.3) blur(10px);opacity:0}}
.go .emblem{animation:flare 2.1s cubic-bezier(.4,0,.3,1) forwards}
@keyframes flare{
  0%{transform:none;filter:none}
  26%{transform:scale(1.09) rotate(3deg);filter:brightness(1.9) saturate(1.3)}
  100%{transform:scale(.94) rotate(-2deg);filter:brightness(.6)}}
.go .ring-out{animation-duration:5s!important}
.go .ring-in{animation-duration:3.2s!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media(max-width:480px){.emblem{width:180px;height:180px}h1{font-size:32px}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="emblem" id="emblem">

      <defs>
        <linearGradient id="gv" x1=".2" y1="0" x2=".8" y2="1">

        </filter>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="1.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

      <g class="ticks" stroke="rgba(139,92,246,.45)" stroke-width="1" stroke-linecap="round">

        <circle cx="178" cy="100" r="2.6" fill="rgba(255,210,122,.85)"/>
        <circle cx="22" cy="100" r="2.6" fill="rgba(255,210,122,.85)"/>
      </g>

      <circle class="arc-load" cx="100" cy="100" r="88" stroke="url(#gg)" stroke-width="2.6"
              stroke-linecap="butt" opacity="0" fill="none"/>

      <g filter="url(#gl)">
        <path class="blade"    fill="url(#gv)" d="M100 16 L154 51 L141 119 L100 180 L100 150 L126 105 L134 59 Z"/>
        <path class="blade"    fill="url(#gv)" d="M100 16 L46 51 L59 119 L100 180 L100 150 L74 105 L66 59 Z"/>
        <path class="blade g2" fill="url(#gc)" d="M100 45 L131 67 L122 104 L100 136 L100 119 L112 97 L117 71 Z"/>
        <path class="blade g2" fill="url(#gc)" d="M100 45 L69 67 L78 104 L100 136 L100 119 L88 97 L83 71 Z"/>
        <path class="blade g3" fill="url(#gg)" d="M154 51 L177 41 L158 72 L152 62 Z"/>
        <path class="blade g3" fill="url(#gg)" d="M46 51 L23 41 L42 72 L48 62 Z"/>
        <path class="blade g4" fill="url(#gg)" d="M100 180 L104 190 L100 206 L96 190 Z"/>
        <path class="blade g4" fill="#fff" opacity=".92" d="M100 4 L127 26 L118 31 L100 17 L82 31 L73 26 Z"/>
      </g>

      <g class="hairs" stroke="#fff" fill="none" stroke-width=".9" opacity=".8" filter="url(#soft)">
        <path class="hair" style="--len:340" d="M100 16 L154 51 L141 119 L100 180"/>
        <path class="hair" style="--len:340" d="M100 16 L46 51 L59 119 L100 180"/>
        <path class="hair g2" style="--len:150" d="M100 45 L131 67 L122 104"/>
        <path class="hair g2" style="--len:150" d="M100 45 L69 67 L78 104"/>
      </g>

      <path class="core" fill="#fff" d="M100 118 L110 133 L100 150 L90 133 Z"/>
      <path class="core2" fill="rgba(126,226,255,.9)" d="M100 126 L104.5 133 L100 141 L95.5 133 Z"/>
    </svg>
    <div class="shock"><i></i><i></i><i></i></div>
  </div>

  <h1 id="ttl">TRADING LAB</h1>
  <div class="sub">RÉSONANCE REQUISE · ACCÈS PRIVÉ</div>

  <div class="form" id="form">
    <div class="field"><input id="u" type="text" placeholder="IDENTIFIANT" autocomplete="off" spellcheck="false"><span class="ic">◆</span></div>
    <div class="field"><input id="p" type="password" placeholder="CLÉ D'ACCÈS" autocomplete="off"><span class="ic">✦</span></div>
    <button class="enter" id="go"><span>ENTRER</span></button>
  </div>
  <div class="status" id="st">EN ATTENTE</div>
</div>
<div id="dive">
  <div class="water"></div>
  <div class="rays"><i style="left:6%;transform:rotate(-9deg);--r2:-5deg"></i><i style="left:21%;transform:rotate(-4deg);--r2:0deg"></i><i style="left:37%;transform:rotate(3deg);--r2:7deg"></i><i style="left:52%;transform:rotate(-6deg);--r2:-2deg"></i><i style="left:68%;transform:rotate(5deg);--r2:9deg"></i><i style="left:84%;transform:rotate(-3deg);--r2:1deg"></i></div>

</div>

<script>
"use strict";

var d2b = function(s){ var r = atob(s), a = new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; };
var b2d = function(b){ var s="", a=new Uint8Array(b); for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };

var st = document.getElementById("st"), body = document.body;
function say(t, cls){ st.textContent = t; st.className = "status" + (cls?" "+cls:""); }

var PHASES = ["INITIALISATION","DÉRIVATION DE LA CLÉ","COUCHE 1","COUCHE 2","OUVERTURE"];
var phTimer = null;
function runPhases(){
  var i = 0; say(PHASES[0]);
  phTimer = setInterval(function(){ i=(i+1)%PHASES.length; say(PHASES[i]); }, 620);
}
function stopPhases(){ clearInterval(phTimer); }

async function derive(user, pass){
  var enc = new TextEncoder();
  var base = enc.encode(user.trim().toLowerCase() + "\u241F" + pass);
  var km = await crypto.subtle.importKey("raw", base, {name:"PBKDF2"}, false, ["deriveBits"]);
  var a = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-512", salt:d2b(V.sA), iterations:V.nA}, km, 256);
  var b = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:d2b(V.sB), iterations:V.nB}, km, 512);
  var bb = new Uint8Array(b);
  return {
    kA: await crypto.subtle.importKey("raw", a, {name:"AES-GCM"}, false, ["decrypt"]),
    kB: await crypto.subtle.importKey("raw", bb.slice(0,32), {name:"AES-GCM"}, false, ["decrypt"]),
    vault: bb.slice(32,64)
  };
}

var tries = 0, locked = false;
async function attempt(){
  if(locked) return;
  var u = document.getElementById("u").value, p = document.getElementById("p").value;
  if(!u || !p){ say("IDENTIFIANT ET CLÉ REQUIS","err"); return; }
  locked = true;
  document.getElementById("go").disabled = true;
  body.classList.add("busy");
  runPhases();
  await new Promise(function(r){ setTimeout(r, 120); });

  var plain = null;
  try{
    var K = await derive(u, p);
    var inner = await crypto.subtle.decrypt({name:"AES-GCM", iv:d2b(V.iA)}, K.kA, d2b(V.d));
    var outer = await crypto.subtle.decrypt({name:"AES-GCM", iv:d2b(V.iB)}, K.kB, inner);
    plain = new TextDecoder().decode(outer);
    try{ sessionStorage.setItem("hub_vk", b2d(K.vault)); }catch(e){}
  }catch(e){ plain = null; }

  stopPhases();
  if(!plain){
    tries++;
    body.classList.remove("busy");
    body.classList.add("bad");
    document.getElementById("stage").classList.add("err-shake");
    say("RÉSONANCE REFUSÉE — TENTATIVE " + tries, "err");
    var wait = Math.min(20, Math.pow(2, tries)) * 1000;
    setTimeout(function(){
      body.classList.remove("bad");
      document.getElementById("stage").classList.remove("err-shake");
      document.getElementById("go").disabled = false;
      document.getElementById("p").value = "";
      document.getElementById("p").focus();
      say("EN ATTENTE");
      locked = false;
    }, Math.max(700, wait));
    return;
  }
  say("ACCÈS ACCORDÉ", "ok");
  body.classList.remove("busy");
  body.classList.add("go");
  var withIntro = plain.replace("__INTRO__", function(){ return "1"; });
  setTimeout(function(){
    document.open(); document.write(withIntro); document.close();
  }, 1980);
}

document.getElementById("go").addEventListener("click", attempt);
document.addEventListener("keydown", function(e){ if(e.key === "Enter") attempt(); });
window.addEventListener("load", function(){ document.getElementById("u").focus(); });
</script>
